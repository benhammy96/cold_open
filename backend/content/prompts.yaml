# Cold Open launch prompt corpus (Task 5).
#
# Two kinds (see app/prompts/schema.py):
#   query   - answers derived from TMDB-style filters (genre/year/votes). These
#             scale automatically once the real TMDB catalog is ingested.
#   curated - an explicit, hand-reviewed title list for categories TMDB can't
#             filter directly (director, award, premise). `query` prompts may
#             also carry `titles:` to seed/augment a set.
#
# Genre ids follow TMDB's scheme (movie + tv). Validate with:
#   python -m app.prompts validate content/prompts.yaml --resolve
#
# NOTE: on the keyless FIXTURE catalog many sets are small; the >= 40 rule is
# relaxed in fixture mode (COLDOPEN_STRICT_CONTENT=false). With a real key the
# genre/year queries fill out to hundreds of answers.

prompts:
  # ---------------- Movies: genre queries ----------------
  - id: horror-movies
    text: "Name a horror movie"
    kind: query
    accepted_entity_types: [movie]
    tags: [horror, genre]
    query: { genres_any: [27], min_vote_count: 50, limit: 300 }

  - id: scifi-movies
    text: "Name a science fiction movie"
