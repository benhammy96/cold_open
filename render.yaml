# Render blueprint for Cold Open.
# Connect this repo as a Blueprint in the Render dashboard to create all three
# resources: managed Postgres, the FastAPI API, and the static frontend.
#
# Two cross-origin URLs can't be auto-wired because a service's PUBLIC url isn't
# known until it exists (Render's fromService `host`/`hostport` are PRIVATE-network
# only, unreachable from a browser). So they use `sync: false` and you set them in
# the dashboard right after the first deploy:
#   - cold-open-web  -> VITE_API_BASE          = https://<api-service>.onrender.com
#   - cold-open-api  -> COLDOPEN_CORS_ORIGINS  = https://<web-service>.onrender.com
# After setting them, trigger one redeploy of each service. (First boot the API
# seeds from keyless fixtures; Task 8 adds the TMDB key + reseed.)

databases:
  - name: cold-open-db
    plan: free
    databaseName: cold_open
    user: cold_open

services:
  # ---- Backend API (FastAPI) ----
  - type: web
    name: cold-open-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Seed on boot, then start the server. `seed --boot` seeds only an empty DB by
    # default (non-destructive), or forces a full reseed when RESEED_ON_BOOT=true
    # (used once after adding the TMDB key). Free tier has no preDeployCommand, so
    # this chains into start.
    startCommand: python -m app.seed --boot && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cold-open-db
          property: connectionString
      # Signed per-run tokens (R50). Render generates this once and keeps it stable.
      - key: COLDOPEN_TOKEN_SECRET
        generateValue: true
      # Set to the static site's public URL after first deploy (see header).
      - key: COLDOPEN_CORS_ORIGINS
        sync: false
      # TMDB key — set the VALUE in the Render dashboard, never in this file.
      - key: TMDB_API_KEY
        sync: false
      # On real TMDB data, enforce the §4 rule (>= 40 answers/prompt).
      - key: COLDOPEN_STRICT_CONTENT
        value: "true"
      # Real-catalog ingest volume (~5000 movies + ~3000 shows).
      - key: COLDOPEN_TMDB_MOVIE_PAGES
        value: "250"
      - key: COLDOPEN_TMDB_TV_PAGES
        value: "150"
      # Flip to true + redeploy ONCE to reseed with real data, then set back to
      # false so restarts don't wipe play data.
      - key: COLDOPEN_RESEED_ON_BOOT
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.10"

  # ---- Frontend (static site) ----
  - type: web
    name: cold-open-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the API's public URL after first deploy, then redeploy (see header).
      - key: VITE_API_BASE
        sync: false
    routes:
      # SPA fallback so client-side routes resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
